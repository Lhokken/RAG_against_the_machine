[project]
name = "llm-sdk"
version = "0.1.0"
description = "LLM SDK for local model inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.13.4",
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",
    "bm25s>=0.3.10",
    "beautifulsoup4>=4.15.0",
    "fire>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]

[tool.mypy]
ignore_missing_imports = true

[tool.uv]
cache-dir = "/sgoinfre/gcerrete/.cache/uv"
